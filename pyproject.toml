[project]
name = 'hostblocker'
version = '2.1.3'
requires-python = '>=3.11'
description = 'Host file domain blocker builder'
license = 'GPL-3.0-or-later'
authors = [
    {name = 'Rui Carlos Gonçalves', email = 'rcgoncalves.pt@gmail.com'}
]
readme = 'README.md'
keywords = ['privacy', 'dns']
dependencies = [
    'PyYAML (>=6.0.0)'
]

[project.urls]
homepage = 'https://rcgoncalves.pt/project/hostblocker/'
repository = 'https://github.com/rcgoncalves/hostblocker'

[project.scripts]
hostblocker = 'hostblocker.main:main'


[build-system]
requires = ['poetry-core>=1.5.0']
build-backend = 'poetry.core.masonry.api'


[tool.setuptools.packages.find]
exclude = ['tests']


[tool.poetry]
include = ['README.md', 'LICENSE', 'CHANGELOG.md']

[tool.poetry.dependencies]
pyyaml = '^6.0.0'

[tool.poetry.group.test.dependencies]
pytest = '^9.0.0'
mockito = '^2.0.0'
coverage = {extras = ['toml'], version = '^7.4.4'}

[tool.poetry.group.dev.dependencies]
mypy = '^1.9.0'
types-pyyaml = '6.0.12.20240311'
ruff = '^0.15.0'


[tool.pytest.ini_options]
testpaths = [
    'tests',
]


[tool.coverage.run]
include = [
    'hostblocker/**/*.py'
]

[tool.coverage.report]
fail_under = 90


[tool.ruff]
line-length = 120
lint.preview = true
lint.select = [
    'F',
    'E', 'W',
    'C90',
    'N',
    'UP',
    'YTT', 'ANN', 'S', 'B', 'A', 'C4', 'EM', 'EXE', 'ISC', 'ICN', 'G', 'PIE', 'PYI', 'PT', 'Q', 'RET', 'SIM', 'TID', 'TCH', 'ARG',
    'PL',
    'TRY',
    'RUF',
]
lint.ignore = ['S101', 'S603', 'S607', 'RET505', 'PLR2004', 'PT009', 'RUF067']
lint.flake8-quotes.inline-quotes = 'single'
lint.pylint.max-statements-in-try = 10
include = ['hostblocker/**/*.py', 'tests/**/*.py']


[tool.mypy]
files = ['hostblocker', 'tests']
strict = true
cache_dir = '~/.cache/mypy'
